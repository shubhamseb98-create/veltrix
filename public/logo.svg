<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Titanium Brushed Edge Gradient -->
    <linearGradient id="tiBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#475569" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </linearGradient>

    <!-- Electric Cyan Jewel Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Core Glow -->
  <circle cx="60" cy="60" r="38" fill="url(#coreGlow)" />

  <!-- Outer Faceted Titanium Hexagon Bezel -->
  <polygon points="60,8 104,33 104,87 60,112 16,87 16,33" 
           stroke="url(#tiBevel)" stroke-width="3" stroke-linejoin="round" fill="#07080c" fill-opacity="0.95"/>

  <!-- Subtle Geometric Chamfers -->
  <polygon points="60,16 97,37 97,83 60,104 23,83 23,37" 
           stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" fill="none"/>

  <!-- Horology Movement Spokes / Dial Indices -->
  <line x1="60" y1="16" x2="60" y2="36" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="60" y1="84" x2="60" y2="104" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="23" y1="37" x2="40" y2="47" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="97" y1="83" x2="80" y2="73" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="23" y1="83" x2="40" y2="73" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="97" y1="37" x2="80" y2="47" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner Chronometer Precision Ring -->
  <circle cx="60" cy="60" r="24" stroke="url(#cyanGlow)" stroke-width="1.8" fill="#05070a" stroke-dasharray="1 5" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="18" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Center Escapement / Chronos Hex Jewel -->
  <polygon points="60,50 69,55 69,65 60,70 51,65 51,55" 
           fill="url(#cyanGlow)" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="2.5" fill="#ffffff"/>
</svg>
